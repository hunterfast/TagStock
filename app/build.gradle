plugins {
    id 'com.android.application'
}

// Jede Auslieferung muss denselben Signierschluessel tragen. Android erlaubt
// ein Update nur, wenn die Signatur zur installierten App passt; sonst bricht
// es wortlos mit "App nicht installiert" ab. Frueher wurde die veroeffentlichte
// APK mit dem Debug-Schluessel signiert - und den erzeugt Gradle auf einem
// frischen CI-Laeufer jedes Mal neu. Darum hier eine feste Reihenfolge:
//
//   1. keystore.properties im Projekt - ortsgebunden, nicht im Repository
//   2. TAGSTOCK_KEYSTORE aus der Umgebung - so reicht die CI ein Secret durch
//   3. app/verteilung.jks - der mitgelieferte Schluessel fuers private Repo
//
// Der dritte Weg genuegt fuer die eigene Verteilung. Wer ihn ersetzen will,
// legt einen eigenen Schluessel an und hinterlegt ihn ueber Weg 1 oder 2 -
// das erzwingt aber einmalig ein Deinstallieren auf allen Geraeten.
def keystoreDatei = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreDatei.exists()) {
    keystore.load(new FileInputStream(keystoreDatei))
}

def signierung = null
if (keystoreDatei.exists()) {
    // Ein relativer Pfad zaehlt ab dem Projektordner, ein absoluter wie er ist.
    def eigene = new File(keystore['storeFile'] as String)
    signierung = [datei    : eigene.isAbsolute() ? eigene
                          : rootProject.file(keystore['storeFile']),
                  speicher : keystore['storePassword'],
                  alias    : keystore['keyAlias'],
                  schluessel: keystore['keyPassword']]
} else if (System.getenv('TAGSTOCK_KEYSTORE')) {
    signierung = [datei    : file(System.getenv('TAGSTOCK_KEYSTORE')),
                  speicher : System.getenv('TAGSTOCK_KEYSTORE_PASSWORT'),
                  alias    : System.getenv('TAGSTOCK_KEY_ALIAS') ?: 'tagstock',
                  schluessel: System.getenv('TAGSTOCK_KEY_PASSWORT')
                          ?: System.getenv('TAGSTOCK_KEYSTORE_PASSWORT')]
} else {
    def verteilung = file('verteilung.jks')
    if (!verteilung.exists()) {
        throw new GradleException('Kein Signierschluessel: app/verteilung.jks fehlt. '
                + 'Ohne festen Schluessel liesse sich die App spaeter nicht aktualisieren.')
    }
    signierung = [datei: verteilung, speicher: 'tagstock',
                  alias: 'tagstock', schluessel: 'tagstock']
}

android {
    namespace 'de.tagstock'
    compileSdk 35

    defaultConfig {
        applicationId "de.tagstock"
        minSdk 24
        targetSdk 35
        // Beim Ausliefern hochzaehlen: die App vergleicht diese Nummer mit der
        // Fassung, die auf dem Server liegt.
        versionCode 6
        versionName "2.1.0"
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        verteilung {
            storeFile signierung.datei
            storePassword signierung.speicher
            keyAlias signierung.alias
            keyPassword signierung.schluessel
        }
    }

    buildTypes {
        // Auch der Debug-Bau bekommt den festen Schluessel: veroeffentlicht
        // wird die Debug-APK, weil sie signiert und damit installierbar ist.
        debug {
            signingConfig signingConfigs.verteilung
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.verteilung
        }
    }

    lint {
        textReport = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'

    // Lifecycle / ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Hintergrundarbeit: Abgleich nachholen, sobald wieder Netz da ist
    implementation 'androidx.work:work-runtime:2.9.1'

    // Room (lokale Datenbank)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // CameraX (Kamera-Vorschau + Analyse fuer Barcode/QR)
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'

    // ML Kit Barcode Scanning (gebuendelt, funktioniert offline)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // QR-Codes selbst erzeugen (Etiketten, Detailansicht)
    implementation 'com.google.zxing:core:3.5.3'

    // Tests laufen auf der JVM; Robolectric stellt Android und SQLite bereit.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
