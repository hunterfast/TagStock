name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Debug-APK bauen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tagstock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
