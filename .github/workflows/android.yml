name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# Fuer die Veroeffentlichung der APK braucht der Lauf Schreibrecht am Inhalt.
permissions:
  contents: write

# Zwei Laeufe desselben Zweigs wuerden dieselbe Veroeffentlichung ueberschreiben.
# Darum weicht der aeltere dem neueren.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: "App: Tests und APK"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      # Robolectric laedt seine Android-Abbilder beim ersten Lauf aus Maven
      # nach. Der Zwischenspeicher spart das meist ein; wenn er leer ist, kann
      # der Download am Netz scheitern - darum bis zu drei Anlaeufe.
      - name: Robolectric-Abbilder aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit-Tests
        run: |
          for versuch in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace testDebugUnitTest; then
              exit 0
            fi
            # Nur Netzfehler beim Nachladen sind einen zweiten Anlauf wert.
            if ! grep -rqE 'MavenArtifactFetcher|SocketException|UnknownHostException' \
                 app/build/reports/tests/testDebugUnitTest \
                 app/build/test-results/testDebugUnitTest 2>/dev/null; then
              echo "Echter Testfehler - kein weiterer Anlauf."
              exit 1
            fi
            echo "Netzfehler beim Nachladen der Testbibliothek (Anlauf ${versuch}/3)."
            sleep $((versuch * 10))
          done
          exit 1

      - name: Lint
        run: |
          ./gradlew --no-daemon lintDebug || {
            find app/build -name 'lint-results-*.txt' -exec cat {} +
            exit 1
          }

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Release-APK bauen (R8)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tagstock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Die App verteilt sich ueber den Server; dafuer braucht es eine
      # Veroeffentlichung mit fester Adresse. Der Debug-Build ist signiert und
      # laesst sich installieren - das unsignierte Release-APK nicht.
      - name: Veroeffentlichung mit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed 's/[^0-9]*//g')
          MARKE="app-v${VERSION_NAME}+${VERSION_CODE}"
          NOTIZ="changelog/app/$(date +%Y)/${VERSION_NAME}.md"
          if [ ! -f "$NOTIZ" ]; then
            NOTIZ=$(ls changelog/app/*/"${VERSION_NAME}".md 2>/dev/null | head -1)
          fi
          [ -n "$NOTIZ" ] && [ -f "$NOTIZ" ] || { echo "Kein Changelog fuer ${VERSION_NAME}"; exit 1; }

          mkdir -p veroeffentlichung
          cp app/build/outputs/apk/debug/*.apk veroeffentlichung/tagstock.apk
          # jq baut das JSON, damit Anfuehrungszeichen und Umbrueche im
          # Changelog nichts zerreissen.
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --rawfile hinweis "$NOTIZ" \
            '{versionCode: $code, versionName: $name, hinweis: $hinweis}' \
            > veroeffentlichung/app.json

          if gh release view "$MARKE" >/dev/null 2>&1; then
            gh release upload "$MARKE" veroeffentlichung/tagstock.apk veroeffentlichung/app.json --clobber
          else
            gh release create "$MARKE" veroeffentlichung/tagstock.apk veroeffentlichung/app.json \
              --title "TagStock-App ${VERSION_NAME}" --notes-file "$NOTIZ" --target "${GITHUB_SHA}"
          fi

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  server:
    name: "Server: Tests und Abbild"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x server/gradlew

      - name: Tests
        working-directory: server
        run: ./gradlew --no-daemon --stacktrace test

      - name: Jar bauen
        working-directory: server
        run: ./gradlew --no-daemon bootJar

      - name: Docker-Abbild bauen
        run: docker build -t tagstock-server:pruefung server

      - name: Container starten und antworten lassen
        run: |
          docker run -d --name tagstock-pruefung -p 8080:8080 tagstock-server:pruefung
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/v1/status > /dev/null; then
              echo "Server antwortet:"
              curl -s http://127.0.0.1:8080/api/v1/status
              docker rm -f tagstock-pruefung
              exit 0
            fi
            sleep 2
          done
          echo "Server ist nicht hochgekommen:"
          docker logs tagstock-pruefung
          docker rm -f tagstock-pruefung
          exit 1

      - name: Server-Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tagstock-server-jar
          path: server/build/libs/tagstock-server.jar
          if-no-files-found: error

      # Aus dieser Veroeffentlichung holt sich der Server seine eigene naechste
      # Fassung - er legt das Jar ins Volume und startet neu, ohne dass jemand
      # auf den Host muss.
      - name: Veroeffentlichung mit Server-Jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 "^version" server/build.gradle | sed "s/[^']*'\([^']*\)'.*/\1/")
          MARKE="server-v${VERSION}"
          NOTIZ="changelog/server/$(date +%Y)/${VERSION}.md"
          if [ ! -f "$NOTIZ" ]; then
            NOTIZ=$(ls changelog/server/*/"${VERSION}".md 2>/dev/null | head -1)
          fi
          [ -n "$NOTIZ" ] && [ -f "$NOTIZ" ] || { echo "Kein Changelog fuer Server ${VERSION}"; exit 1; }

          mkdir -p veroeffentlichung
          cp server/build/libs/tagstock-server.jar veroeffentlichung/
          jq -n --arg version "$VERSION" --rawfile hinweis "$NOTIZ" \
            '{version: $version, hinweis: $hinweis}' > veroeffentlichung/server.json

          if gh release view "$MARKE" >/dev/null 2>&1; then
            gh release upload "$MARKE" veroeffentlichung/tagstock-server.jar \
              veroeffentlichung/server.json --clobber
          else
            gh release create "$MARKE" veroeffentlichung/tagstock-server.jar \
              veroeffentlichung/server.json \
              --title "TagStock-Server ${VERSION}" --notes-file "$NOTIZ" --target "${GITHUB_SHA}"
          fi
