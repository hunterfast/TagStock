name: App

# Gebaut wird nur, wenn sich an der App etwas getan hat - eine Aenderung am
# Server oder an der Doku braucht keine neue APK.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'changelog/app/**'
      - '.github/workflows/android.yml'
      - '.github/startprobe.sh'
  workflow_dispatch:

# Fuer die Veroeffentlichung der APK braucht der Lauf Schreibrecht am Inhalt.
permissions:
  contents: write

# Zwei Laeufe desselben Zweigs wuerden dieselbe Veroeffentlichung ueberschreiben.
# Darum weicht der aeltere dem neueren.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: "App: Tests und APK"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Ohne Angabe will die Aktion auch das alte Paket "tools" installieren,
      # das der sdkmanager auf den Laeufern nicht mehr kennt - dann bricht
      # der Schritt ab. Plattform und Build-Tools holt Gradle selbst.
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      # Robolectric laedt seine Android-Abbilder beim ersten Lauf aus Maven
      # nach. Der Zwischenspeicher spart das meist ein; wenn er leer ist, kann
      # der Download am Netz scheitern - darum bis zu drei Anlaeufe.
      - name: Robolectric-Abbilder aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit-Tests
        run: |
          for versuch in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace testDebugUnitTest; then
              exit 0
            fi
            # Nur Netzfehler beim Nachladen sind einen zweiten Anlauf wert.
            if ! grep -rqE 'MavenArtifactFetcher|SocketException|UnknownHostException' \
                 app/build/reports/tests/testDebugUnitTest \
                 app/build/test-results/testDebugUnitTest 2>/dev/null; then
              echo "Echter Testfehler - kein weiterer Anlauf."
              exit 1
            fi
            echo "Netzfehler beim Nachladen der Testbibliothek (Anlauf ${versuch}/3)."
            sleep $((versuch * 10))
          done
          exit 1

      - name: Lint
        run: |
          ./gradlew --no-daemon lintDebug || {
            find app/build -name 'lint-results-*.txt' -exec cat {} +
            exit 1
          }

      # Verkleinert von R8 und mit dem festen Schluessel signiert. Die APK
      # liegt danach in der Veroeffentlichung - ein Artefakt am Lauf braucht
      # es dafuer nicht.
      - name: Release-APK bauen (R8)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Einmalig beim Wechsel auf die R8-APK: starten und bedienen, bevor sie
      # veroeffentlicht wird.
      - name: KVM fuer den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Startprobe im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/startprobe.sh

      # Die App verteilt sich ueber den Server; dafuer braucht es eine
      # Veroeffentlichung mit fester Adresse.
      - name: Veroeffentlichung mit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed 's/[^0-9]*//g')
          MARKE="app-v${VERSION_NAME}+${VERSION_CODE}"
          NOTIZ="changelog/app/$(date +%Y)/${VERSION_NAME}.md"
          if [ ! -f "$NOTIZ" ]; then
            NOTIZ=$(ls changelog/app/*/"${VERSION_NAME}".md 2>/dev/null | head -1)
          fi
          [ -n "$NOTIZ" ] && [ -f "$NOTIZ" ] || { echo "Kein Changelog fuer ${VERSION_NAME}"; exit 1; }

          mkdir -p veroeffentlichung
          cp app/build/outputs/apk/release/app-release.apk veroeffentlichung/tagstock.apk
          # jq baut das JSON, damit Anfuehrungszeichen und Umbrueche im
          # Changelog nichts zerreissen.
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --rawfile hinweis "$NOTIZ" \
            '{versionCode: $code, versionName: $name, hinweis: $hinweis}' \
            > veroeffentlichung/app.json

          if gh release view "$MARKE" >/dev/null 2>&1; then
            gh release upload "$MARKE" veroeffentlichung/tagstock.apk veroeffentlichung/app.json --clobber
          else
            gh release create "$MARKE" veroeffentlichung/tagstock.apk veroeffentlichung/app.json \
              --title "TagStock-App ${VERSION_NAME}" --notes-file "$NOTIZ" --target "${GITHUB_SHA}"
          fi

      # Nur wenn etwas schiefging - sonst liest sie niemand.
      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
