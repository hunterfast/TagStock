name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Tests und APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Unit-Tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Release-APK bauen (R8)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tagstock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
