plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'de.tagstock'
version = '2.1.1'

java {
    // Bytecode fuer Java 17; gebaut wird mit dem vorhandenen JDK (17 oder neuer).
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Version und Bauzeitpunkt landen im Jar; der Server sagt damit, welcher Stand
// laeuft, und erkennt, ob es inzwischen einen neueren gibt.
springBoot {
    buildInfo()
}

// Quelltext und Ausgabe sind UTF-8; sonst verrutschen Umlaute je nach System.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Passwoerter werden mit BCrypt gespeichert; nur die Krypto-Bibliothek,
    // kein vollstaendiges Spring Security.
    implementation 'org.springframework.security:spring-security-crypto'

    // SQLite - eine Datei im Datenverzeichnis, kein zweiter Container noetig.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'tagstock-server.jar'
}
