<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TagStock-Server</title>
    <link rel="icon" href="/icon.png">
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; padding: 32px 16px;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f7f8fa; color: #1f2430;
            display: flex; flex-direction: column; align-items: center;
        }
        img { width: min(320px, 80vw); height: auto; }
        .karte {
            background: #fff; border: 1px solid #dde1e8; border-radius: 12px;
            padding: 20px 24px; margin-top: 24px; width: min(520px, 100%);
            box-sizing: border-box;
        }
        h1 { font-size: 1.1rem; margin: 0 0 12px; }
        dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
        dt { color: #5a6273; }
        dd { margin: 0; font-variant-numeric: tabular-nums; }
        .gut { color: #059669; font-weight: 600; }
        .schlecht { color: #ef4444; font-weight: 600; }
        p.hinweis { color: #5a6273; font-size: .9rem; }
        a { color: #1a6ee6; }
        @media (prefers-color-scheme: dark) {
            body { background: #14161a; color: #e7e9ee; }
            .karte { background: #1c1f26; border-color: #2c313b; }
            dt, p.hinweis { color: #a2a9b8; }
        }
    </style>
</head>
<body>
<img src="/logo.png" alt="TagStock">

<div class="karte">
    <h1>Server</h1>
    <dl>
        <dt>Zustand</dt><dd id="zustand">wird geprüft …</dd>
        <dt>Version</dt><dd id="version">–</dd>
        <dt>Gebaut am</dt><dd id="gebaut">–</dd>
        <dt>Eingerichtet</dt><dd id="eingerichtet">–</dd>
    </dl>
    <p class="hinweis">
        Diese Adresse trägst du in der App unter <em>Einstellungen → Server</em> ein.
        Liegt eine App auf dem Server, findest du sie unter
        <a href="/api/v1/app/tagstock.apk">tagstock.apk</a>.
    </p>
</div>

<script>
    fetch('/api/v1/status').then(function (antwort) {
        return antwort.json();
    }).then(function (status) {
        var zustand = document.getElementById('zustand');
        zustand.textContent = status.bereit ? 'läuft' : 'gestört';
        zustand.className = status.bereit ? 'gut' : 'schlecht';
        document.getElementById('version').textContent = status.version || '–';
        document.getElementById('gebaut').textContent = status.gebautAm
            ? new Date(status.gebautAm).toLocaleString('de-DE') : '–';
        document.getElementById('eingerichtet').textContent = status.eingerichtet
            ? 'ja, es gibt mindestens ein Konto'
            : 'noch kein Konto – das erste darf sich immer anlegen';
    }).catch(function () {
        var zustand = document.getElementById('zustand');
        zustand.textContent = 'nicht erreichbar';
        zustand.className = 'schlecht';
    });
</script>
</body>
</html>
