server:
  port: ${TAGSTOCK_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: tagstock-server
  datasource:
    # Standardpfad passt zum Docker-Volume /data
    url: jdbc:sqlite:${TAGSTOCK_DB:/data/tagstock.db}?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite vertraegt keine parallelen Schreiber.
      maximum-pool-size: 1
      pool-name: tagstock
  sql:
    init:
      mode: always
      platform: sqlite

tagstock:
  # Artikelbilder liegen als Dateien hier; im Docker-Abbild im Volume /data.
  bilder-ordner: ${TAGSTOCK_BILDER:/data/bilder}
  # Groesste erlaubte Bilddatei in MB.
  bild-max-mb: ${TAGSTOCK_BILD_MAX_MB:8}
  # Nachschlagedienst fuer Produktdaten zu einer GTIN: aus, opengtindb oder
  # eansearch. Ohne Eintrag fragt der Server nichts nach aussen.
  gtin-dienst: ${TAGSTOCK_GTIN_DIENST:aus}
  # Zugangsschluessel des Dienstes, falls er einen braucht.
  gtin-schluessel: ${TAGSTOCK_GTIN_SCHLUESSEL:}
  # So lange gilt ein Fehlschlag, bevor dieselbe Nummer erneut erfragt wird.
  gtin-fehlschlag-tage: ${TAGSTOCK_GTIN_FEHLSCHLAG_TAGE:7}
  # Taeglich nachsehen, ob es einen neueren Stand gibt. Aktualisiert wird nie
  # von selbst - der Server sagt nur Bescheid.
  update-pruefen: ${TAGSTOCK_UPDATE_PRUEFEN:true}
  # Woher der Vergleich kommt; leer heisst: der Zweig auf GitHub.
  update-quelle: ${TAGSTOCK_UPDATE_QUELLE:}
  # Hier liegen die App-Fassungen: app/aktuell und app/vorher.
  app-ordner: ${TAGSTOCK_APP_ORDNER:/data/app}
  # Der Server holt sich die neueste App selbst - nur wenn er sie nicht hat.
  app-holen: ${TAGSTOCK_APP_HOLEN:true}
  # Woher; leer heisst: die Veroeffentlichungen dieses Projekts auf GitHub.
  app-quelle: ${TAGSTOCK_APP_QUELLE:}
  # Lesezugriff auf das Projekt. Ohne ihn holt der Server nichts von selbst.
  github-token: ${TAGSTOCK_GITHUB_TOKEN:}
  # Hier legt der Server seine eigene Fassung ab, wenn er sich aktualisiert.
  # Beim Start wird sie der aus dem Abbild vorgezogen (siehe start.sh).
  server-ordner: ${TAGSTOCK_SERVER_ORDNER:/data/server}
  # Darf sich der Server selbst aktualisieren? Er tut es nie ungefragt - das
  # hier erlaubt nur den Knopf in der Oberflaeche.
  selbst-aktualisieren: ${TAGSTOCK_SELBST_AKTUALISIEREN:true}
  # Woher die Serverfassungen kommen; leer heisst: die Veroeffentlichungen
  # dieses Projekts auf GitHub.
  server-quelle: ${TAGSTOCK_SERVER_QUELLE:}
  # Sicherungen der Datenbank vor jedem Wechsel der App-Fassung.
  sicherungen-ordner: ${TAGSTOCK_SICHERUNGEN:/data/sicherungen}
  # Token laufen nach dieser Zeit ab (Tage).
  token-gueltigkeit-tage: ${TAGSTOCK_TOKEN_TAGE:180}
  # Wenn gesetzt, koennen sich nur Personen mit diesem Code registrieren.
  registrierungs-code: ${TAGSTOCK_REGISTRIERUNGSCODE:}

logging:
  level:
    root: INFO
